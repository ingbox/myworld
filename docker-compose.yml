services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    env_file:
      - .env
    ports:
      - "3005:3005"
    restart: unless-stopped
